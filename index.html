<style>
*{margin:0}
html,body{height:100%;background:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{display:grid;place-items:center}
#stage{position:relative;width:min(100vw,calc(100vh*390/844));height:min(100vh,calc(100vw*844/390))}
@supports (height:100dvh){#stage{width:min(100vw,calc(100dvh*390/844));height:min(100dvh,calc(100vw*844/390))}}
#c,#s{position:absolute;inset:0;width:100%;height:100%;display:block}
#s{will-change:transform} /* own layer: the pen redraws only the words, never the flower */

/* faint paper grain: a tile baked once at load */
body{background:#fff var(--paper) 0 0/200px}

/* the pen: a round nib travels each traced stroke and uncovers the ink beneath */
.pen{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;animation:write var(--t) cubic-bezier(.45,.05,.4,1) var(--d) both}
@keyframes write{from{stroke-dashoffset:1;opacity:0}.1%{opacity:1}to{stroke-dashoffset:0}}

/* nothing moves until the first frame is on screen */
body:not(.go) *{animation-play-state:paused!important}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.pen{stroke-dashoffset:0}}
</style>

}

function size(){
  const b=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(b.width*dpr);cv.height=Math.round(b.height*dpr);K=cv.width/390;
  fibre=ctx.createPattern(fibreTile,'repeat');fibre.setTransform(new DOMMatrix().scale(.5));
  cache=null;
}

const step=(x,n)=>Math.floor(Math.min(Math.max(x,0),1)*n)/n;
// strip state at time t: folded into the bud, swings open in hard steps, flattens
function pose(s,t){
  const u=(t-s.d)/UNF;
  if(u>=1)return [s.a,1,1];
  if(u<.3){const q=step(u/.3,10);return [s.a0,.14+.12*q,.3+.2*q]}
  const q=step((u-.3)/.7,10);return [s.a0+(s.a-s.a0)*q,.26+.74*q,.5+.5*q];
}
const boil=(L,t)=>{const ph=(t%L.p)/L.p;return ph<.34?0:ph<.67?L.w:-.8*L.w};

// one paper layer around (ox,oy) in device px, base rotation b
function paintLayer(c,L,t,ox,oy,b,k){
  for(const pass of [0,1]){
    for(const s of L.strips){
      const [a,sx,sy]=pose(s,t),th=a+b,co=Math.cos(th)*k,si=Math.sin(th)*k;
      if(pass===0){ // cut-paper shadow, always falling the same way
        c.setTransform(co*sx,si*sx,-si*sy,co*sy,ox+.7*k,oy+1.7*k);
        c.globalAlpha=.16;c.fillStyle='#3a2a10';c.fill(s.path);continue;
      }
      c.setTransform(co*sx,si*sx,-si*sy,co*sy,ox,oy);
      c.globalAlpha=s.op;c.fillStyle=s.fill;c.fill(s.path);c.globalAlpha=1;
      if(s.crease){c.fillStyle=s.crease;c.fill(s.path)}
      c.fillStyle=fibre;c.fill(s.path);
    }
  }
  c.globalAlpha=1;
}

function bake(){ // after bloom: each layer becomes one bitmap
  const S=Math.ceil(2*(FL.rad*1.05+6)*K);
  cache=layers.map(L=>{const c=document.createElement('canvas');c.width=c.height=S;
    const x=c.getContext('2d');paintLayer(x,L,1e9,S/2,S/2,0,K);return {c,S}});
}

function draw(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  const sp=step((t-.2)/1.5,15); // stem draws in hard steps, like frames
  if(sp>0){
    ctx.lineWidth=9;ctx.lineCap='round';ctx.setLineDash([stemL,stemL]);ctx.lineDashOffset=stemL*(1-sp);
    ctx.setTransform(K,0,0,K,.8*K,1.8*K);ctx.globalAlpha=.2;ctx.strokeStyle='#3a2a10';ctx.stroke(stemP);ctx.globalAlpha=1;
    ctx.setTransform(K,0,0,K,0,0);ctx.strokeStyle=FL.stem;ctx.stroke(stemP);ctx.strokeStyle=fibre;ctx.stroke(stemP);
    ctx.setLineDash([]);
  }
  if(t<T)return;
  if(t>=bloom&&!cache)bake();
  layers.forEach((L,i)=>{
    const b=boil(L,t); // stop-motion wobble: each paper layer on its own beat
    if(cache){const {c,S}=cache[i],co=Math.cos(b),si=Math.sin(b);
      ctx.setTransform(co,si,-si,co,CX*K,CY*K);ctx.drawImage(c,-S/2,-S/2);}
    else paintLayer(ctx,L,t,CX*K,CY*K,b,K);
  });
  ctx.setTransform(K,0,0,K,0,0);ctx.fillStyle=FL.eye[1];ctx.beginPath();ctx.arc(CX,CY,FL.eye[0],0,7);ctx.fill();
}

// Calligraphy: glyph outlines from Pinyon Script (OFL), plus the pen path traced through each stroke.
// write() sets a line in a slot, centred on cx, and lets the nib run between t1 and t2 seconds from now.
let mid=0;
function write(slot,text,cx,y,sc,t1,t2){
  slot.replaceChildren();
  const id='pen'+mid++,m=E('mask',{id,maskUnits:'userSpaceOnUse',x:-100,y:-100,width:2000,height:400},slot);
  const ink=E('g',{fill:'#1c1714',mask:`url(#${id})`},slot),plan=[];
  let x=0,at=0;
  for(const ch of text){
    const g=GL[ch];x+=g.pre;
    if(!g.ink){x+=g.adv;at+=.3;continue}
    const transform=`translate(${x.toFixed(1)} 0)`;
    E('path',{d:g.ink,transform},ink);E('path',{d:g.ink,transform,fill:'url(#speck)'},ink);
    for(const [d,w,len] of g.strokes){const t=.08+len/300;plan.push([d,w,at,t,transform]);at+=t+.03}
    at+=.06;x+=g.adv;
  }
  const fit=(t2-t1)/Math.max(at-.09,.1);
  for(const [d,w,s,t,transform] of plan)
    E('path',{d,transform,class:'pen','stroke-width':w,pathLength:1,style:`--d:${(t1+s*fit).toFixed(2)}s;--t:${(t*fit).toFixed(2)}s`},m);
  slot.setAttribute('transform',`translate(${(cx-x*sc/2).toFixed(1)} ${y}) scale(${sc})`);
}

let cur=-1,t0=null,tick=-1,said='';
function grow(v){
  build(v);cur=v;t0=null;tick=-1;
  // the count is written while the stem rises; the headline (only when it changes) from sprout to full bloom
  write($('count'),`${v+1}/${V.length}`,195,772,.48,.25,T-.1);
  const msg=v===V.length-1?'jeg elsker dig':'happy 27’th';
  if(msg!==said){write($('head'),msg,195,104,1,T,bloom);said=msg}
}

// #3 in the address opens flower 3; otherwise it starts at the first
let v=parseInt(location.hash.slice(1))-1;
size();grow(v>=0&&v<V.length?v:0);

const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function frame(now){
  if(t0===null){t0=now;document.body.classList.add('go')}
  const t=still?1e9:(now-t0)/1000,k=Math.floor(t*FPS);
  if(k!==tick){tick=k;draw(k/FPS)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize',()=>{size();tick=-1});
// tap anywhere: the next flower grows
document.addEventListener('click',()=>grow((cur+1)%V.length));
</script>
</body>
</html>
