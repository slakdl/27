<!doctype html>

<style>
*{margin:0}
html,body{height:100%;background:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{display:grid;place-items:center}
svg{width:min(100vw,calc(100dvh*390/844));height:min(100dvh,calc(100vw*844/390));display:block}

/* faint paper grain: a tile baked once at load (see grain()) */
body{background:#fff var(--paper) 0 0/200px}

/* stem draws in hard steps, like frames */
.stem{stroke-dasharray:1;animation:grow 1.5s steps(15) .2s backwards}
@keyframes grow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* each strip is folded into the bud, then swings open and flattens */
.st{transform-box:view-box;transform-origin:0 0;rotate:var(--a);animation:unfold 2.4s steps(10) var(--d) backwards}
@keyframes unfold{
  0%{rotate:var(--a0);scale:.14 .3}
  30%{rotate:var(--a0);scale:.26 .5}
  100%{rotate:var(--a);scale:1 1}
}
/* flower stays hidden until the stem has arrived */
#flower{animation:reveal 0s steps(1) 1.7s backwards}
@keyframes reveal{from{opacity:0}}

/* stop-motion wobble: each paper layer on its own beat */
.boil{transform-box:view-box;transform-origin:0 0;animation:boil var(--p) steps(1) infinite}
@keyframes boil{0%{transform:rotate(0)}34%{transform:rotate(var(--w))}67%{transform:rotate(calc(var(--w)*-.8))}}

/* the pen: a round nib travels each traced stroke and uncovers the ink beneath */
.pen{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;animation:write var(--t) cubic-bezier(.45,.05,.4,1) var(--d) both}
@keyframes write{from{stroke-dashoffset:1;opacity:0}.1%{opacity:1}to{stroke-dashoffset:0}}

/* nothing moves until the first frame is on screen */
body:not(.go) *{animation-play-state:paused!important}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.pen{stroke-dashoffset:0}}
</style>
</head>

// petal shapes: half-width w, length l, base at the centre, tip pointing up

let seed=5;
const R=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const r=(a,b)=>a+R()*(b-a),pick=a=>a[Math.floor(R()*a.length)];
const NS='http://www.w3.org/2000/svg';
const E=(t,at,p)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);p&&p.append(e);return e};

const defs=document.getElementById('defs'),grads=[];let gi=0;
const paint=c=>{
  if(typeof c==='string')return c;
  const g=E('linearGradient',{id:'g'+gi,x1:0,y1:1,x2:0,y2:0},defs);grads.push(g);
  c.forEach((s,i)=>E('stop',{offset:i/(c.length-1),'stop-color':s},g));
  return `url(#g${gi++})`;
};

const strip=(g,d,ang,fill,op,len,crease)=>{

  const k=a*Math.PI/180,c=Math.cos(k),s=Math.sin(k);
  E('path',{d,fill:'#3a2a10',opacity:.16,transform:`translate(${(.7*c+1.7*s).toFixed(2)} ${(1.7*c-.7*s).toFixed(2)})`},el);

// noise tiles, made once: fibre = soft horizontal mottling + white flecks; speck = pale ink dropout; paper = background grain
function tile(w,h,px){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h);
  for(let i=0;i<w*h;i++)im.data.set(px(),i*4);x.putImageData(im,0,0);return c}
function grain(){
  const f=document.createElement('canvas');f.width=f.height=256;const x=f.getContext('2d');
  x.drawImage(tile(16,96,()=>[0,0,0,Math.random()*40]),0,0,256,256);          // streaky fibre, stretched along x
  x.drawImage(tile(256,256,()=>Math.random()<.025?[255,255,255,70+Math.random()*100]:[0,0,0,0]),0,0);
  $('fibreImg').setAttribute('href',f.toDataURL());
  $('speckImg').setAttribute('href',tile(128,128,()=>Math.random()<.1?[255,255,255,120+Math.random()*130]:[0,0,0,0]).toDataURL());
  document.body.style.setProperty('--paper',`url(${tile(200,200,()=>[115,102,90,Math.random()**3*22]).toDataURL()})`);
}
grain();
const restart=el=>{el.style.animation='none';el.getBoundingClientRect();el.style.animation=''};

let cur=-1;
function grow(v){
  const FL=V[v];
  seed=5+v*1013;RAD=FL.rad;
  F.replaceChildren();grads.splice(0).forEach(g=>g.remove());
  // stem rises from below the page and ends in the flower's centre
  for(const el of stems)el.setAttribute('d',`M${FL.sx} 870Q${195+(FL.sx-195)*.28} 660 195 422`);

  for(const [sh,n,len,wid,cols,crease,p,sw,jit,x={}] of FL.L){

      const l=RAD*r(...len),w=RAD*r(...wid);
      strip(L,SH[sh](w,l),i*360/n+(x.rot||0)+r(-jit,jit),tip&&R()<tip[0]?pick(tip[1]):pick(cs),r(.88,1),l,crease);
    }
  }
  E('circle',{r:FL.eye[0],fill:FL.eye[1]},F);
  stems.forEach(restart);restart(F);

}
const another=()=>{let v;do v=Math.floor(Math.random()*V.length);while(v===cur);return v};
